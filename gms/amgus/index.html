<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Among Us</title>
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/wasmdotrip/AmongUsPort@main/TemplateData/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wasmdotrip/AmongUsPort@main/TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="540" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
        <div id="unity-loading-status" role="status">Downloading game… 0%</div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const loadingStatus = document.querySelector("#unity-loading-status");
      const warningBanner = document.querySelector("#unity-warning");
      const assetBaseUrl = "https://cdn.jsdelivr.net/gh/wasmdotrip/AmongUsPort@main";
      const buildUrl = assetBaseUrl + "/Build";
      const loaderUrl = buildUrl + "/AmongUsWeb.loader.js";
      const config = {
        dataUrl: null,
        frameworkUrl: buildUrl + "/AmongUsWeb.framework.js",
        codeUrl: null,
        streamingAssetsUrl: assetBaseUrl + "/StreamingAssets",
        companyName: "Innersloth",
        productName: "Among Us",
        productVersion: "2026.6.5",
        showBanner: unityShowBanner
      };

      function unityShowBanner(message, type) {
        const div = document.createElement("div");
        div.textContent = message;
        if (type === "error") div.style.cssText = "background:red;padding:10px;color:white";
        else if (type === "warning") {
          div.style.cssText = "background:yellow;padding:10px;color:black";
          setTimeout(() => div.remove(), 5000);
        }
        warningBanner.appendChild(div);
      }

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      loadingBar.style.display = "block";
      canvas.style.visibility = "hidden";

      const nativeFetch = window.fetch.bind(window);
      const NativeXMLHttpRequest = window.XMLHttpRequest;
      const NativeWebSocket = window.WebSocket;
      const overrideServer = new URLSearchParams(location.search).get("server");
      let serverReplacement = null;
      if (overrideServer) {
        try { serverReplacement = new URL(overrideServer); } catch (_) {}
      }

      function rewriteToServer(url, wantWebSocket) {
        if (!serverReplacement) return url;
        let target;
        try { target = new URL(url, location.href); } catch (_) { return url; }
        if (target.protocol === "blob:" || target.host === location.host) return url;
        target.protocol = wantWebSocket
          ? (serverReplacement.protocol === "https:" ? "wss:" : "ws:")
          : (serverReplacement.protocol === "wss:" ? "https:" : "http:");
        target.host = serverReplacement.host;
        return target.toString();
      }

      if (serverReplacement) {
        window.WebSocket = function(url, protocols) {
          const target = rewriteToServer(url, true);
          return protocols === undefined ? new NativeWebSocket(target) : new NativeWebSocket(target, protocols);
        };
        window.WebSocket.prototype = NativeWebSocket.prototype;
        window.XMLHttpRequest = function() {
          const xhr = new NativeXMLHttpRequest();
          const originalOpen = xhr.open;
          xhr.open = function(method, url) {
            const args = Array.from(arguments);
            args[1] = rewriteToServer(String(url), false);
            return originalOpen.apply(xhr, args);
          };
          return xhr;
        };
        window.XMLHttpRequest.prototype = NativeXMLHttpRequest.prototype;
      }

      const streamingAssetFiles = [
        { url: "StreamingAssets/aa/AddressablesLink/link.xml", bytes: 28931, type: "application/xml" },
        { url: "StreamingAssets/aa/catalog.json", bytes: 1099514, type: "application/json" },
        { url: "StreamingAssets/aa/settings.json", bytes: 844, type: "application/json" },
        { url: "StreamingAssets/aa/WebGL/453b0a9b2ef9b8a4080b2014844ce426_unitybuiltinshaders_2536dfd3f978a44e0658621a7478bc60.bundle", bytes: 56557, type: "application/octet-stream" },
        { url: "StreamingAssets/CustomAssetPacksData.json", bytes: 137, type: "application/json" },
        { url: "StreamingAssets/UnityServicesProjectConfiguration.json", bytes: 1131, type: "application/json" }
      ];
      const downloadTotalBytes = 106373377 + 166806921 + 589939296 + streamingAssetFiles.reduce((sum, file) => sum + file.bytes, 0);
      let downloadedBytes = 0;
      let downloadProgressFrame = null;
      let loadingFailed = false;
      const preloadAbort = new AbortController();
      const streamingAssetCache = new Map();

      function showLoadingProgress(progress, message) {
        progressBarFull.style.width = Math.round(progress * 100) + "%";
        loadingStatus.textContent = message;
      }
      function recordDownloadedBytes(bytes) {
        if (loadingFailed) return;
        downloadedBytes += bytes;
        if (downloadProgressFrame !== null) return;
        downloadProgressFrame = requestAnimationFrame(() => {
          downloadProgressFrame = null;
          const progress = Math.min(downloadedBytes / downloadTotalBytes, 1);
          showLoadingProgress(progress * 0.85, "Downloading game… " + Math.floor(progress * 100) + "%");
        });
      }

      async function downloadBlob(url, mimeType) {
        const response = await nativeFetch(url, { signal: preloadAbort.signal, cache: "no-cache" });
        if (!response.ok) throw new Error("Failed to load " + url + " (HTTP " + response.status + ")");
        if (!response.body || !response.body.getReader) {
          const buffer = await response.arrayBuffer();
          recordDownloadedBytes(buffer.byteLength);
          return new Blob([buffer], { type: mimeType });
        }
        const reader = response.body.getReader();
        const chunks = [];
        try {
          while (true) {
            const chunk = await reader.read();
            if (chunk.done) break;
            chunks.push(chunk.value);
            recordDownloadedBytes(chunk.value.byteLength);
          }
        } finally { reader.releaseLock(); }
        return new Blob(chunks, { type: mimeType });
      }

      async function combinePartsToBlob(baseUrl, partCount, mimeType, partNumberWidth) {
        const blobs = await Promise.all(Array.from({ length: partCount }, (_, index) => {
          const partNumber = String(index + 1).padStart(partNumberWidth || 0, "0");
          return downloadBlob(baseUrl + ".part" + partNumber, mimeType);
        }));
        return new Blob(blobs, { type: mimeType });
      }
      async function combineParts(baseUrl, partCount, mimeType, partNumberWidth) {
        return URL.createObjectURL(await combinePartsToBlob(baseUrl, partCount, mimeType, partNumberWidth));
      }

      const splitBundles = {
        "defaultlocalgroup_assets__db69efd6d6015cdfb90e3e77a7544e5b.bundle": { partCount: 34, partNumberWidth: 2, blobPromise: null }
      };
      function bundleBlob(baseUrl, splitBundle) {
        if (!splitBundle.blobPromise) {
          splitBundle.blobPromise = combinePartsToBlob(baseUrl, splitBundle.partCount, "application/octet-stream", splitBundle.partNumberWidth)
            .catch(error => { splitBundle.blobPromise = null; throw error; });
        }
        return splitBundle.blobPromise;
      }
      function blobResponse(blob) {
        return new Response(blob, { status: 200, headers: { "Content-Type": blob.type, "Content-Length": String(blob.size) } });
      }
      async function preloadStreamingAssets() {
        const regularFiles = streamingAssetFiles.map(async file => {
          const url = new URL(file.url, assetBaseUrl + "/").href;
          const promise = downloadBlob(url, file.type);
          streamingAssetCache.set(url, promise);
          await promise;
        });
        const bundles = Object.keys(splitBundles).map(fileName =>
          bundleBlob(assetBaseUrl + "/StreamingAssets/aa/WebGL/" + fileName, splitBundles[fileName])
        );
        await Promise.all(regularFiles.concat(bundles));
      }

      window.fetch = function(resource, options) {
        const requestUrl = typeof resource === "string" ? resource : resource instanceof URL ? resource.href : resource.url;
        const cleanUrl = requestUrl.split("?")[0].split("#")[0];
        const cached = streamingAssetCache.get(new URL(cleanUrl, location.href).href);
        if (cached) return cached.then(blobResponse);
        const fileName = cleanUrl.substring(cleanUrl.lastIndexOf("/") + 1);
        const splitBundle = splitBundles[fileName];
        if (!splitBundle) {
          const rewritten = rewriteToServer(requestUrl, false);
          return rewritten !== requestUrl ? nativeFetch(rewritten, options) : nativeFetch(resource, options);
        }
        return bundleBlob(cleanUrl, splitBundle).then(blobResponse);
      };

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = async () => {
        try {
          const combinedUrls = await Promise.all([
            combineParts(buildUrl + "/AmongUsWeb.data", 6, "application/octet-stream"),
            combineParts(buildUrl + "/AmongUsWeb.wasm", 9, "application/wasm"),
            preloadStreamingAssets()
          ]);
          config.dataUrl = combinedUrls[0];
          config.codeUrl = combinedUrls[1];
          if (downloadProgressFrame !== null) cancelAnimationFrame(downloadProgressFrame);
          showLoadingProgress(0.85, "Starting game…");
          await createUnityInstance(canvas, config, progress => showLoadingProgress(0.85 + progress * 0.15, "Starting game…"));
          canvas.style.visibility = "visible";
          loadingBar.style.display = "none";
        } catch (error) {
          loadingFailed = true;
          preloadAbort.abort();
          if (downloadProgressFrame !== null) cancelAnimationFrame(downloadProgressFrame);
          loadingStatus.textContent = "Unable to load game";
          unityShowBanner(error.message || String(error), "error");
        }
      };
      script.onerror = () => {
        loadingStatus.textContent = "Unable to load game files";
        unityShowBanner("Could not load the Among Us Unity loader from jsDelivr.", "error");
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
