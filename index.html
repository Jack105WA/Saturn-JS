<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b13">
  <meta name="description" content="A collection of browser experiences.">
  <title>Saturn</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090b13;
      color: #edf0fa;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% -15%, rgba(91, 105, 170, .17), transparent 52%),
        #090b13;
    }
    .shell {
      width: min(900px, calc(100% - 40px));
      margin: 0 auto;
      padding: 92px 0 64px;
    }
    header { margin-bottom: 42px; }
    .wordmark {
      margin: 0;
      font-size: clamp(2rem, 5vw, 2.65rem);
      font-weight: 650;
      letter-spacing: -.075em;
    }
    .rule {
      width: 38px;
      height: 3px;
      margin-top: 17px;
      border-radius: 10px;
      background: #8b91c9;
      opacity: .8;
    }
    .section-label {
      margin: 0 0 15px 2px;
      color: #858ba2;
      font-size: .72rem;
      font-weight: 650;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 13px;
    }
    .game-link {
      display: flex;
      min-height: 86px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 20px 21px;
      color: inherit;
      text-decoration: none;
      background: rgba(255, 255, 255, .035);
      border: 1px solid rgba(181, 190, 226, .105);
      border-radius: 13px;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .game-link:hover {
      transform: translateY(-2px);
      background: rgba(137, 145, 201, .09);
      border-color: rgba(164, 173, 232, .32);
    }
    .game-name { font-size: .98rem; font-weight: 560; }
    .arrow {
      color: #9299c9;
      font-size: 1.2rem;
      transition: transform .18s ease;
    }
    .game-link:hover .arrow { transform: translateX(3px); }
    footer {
      margin-top: 72px;
      color: #555c72;
      font-size: .76rem;
    }
    @media (max-width: 600px) {
      .shell { padding-top: 64px; }
      header { margin-bottom: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1 class="wordmark">Saturn</h1>
      <div class="rule" aria-hidden="true"></div>
    </header>

    <section aria-labelledby="collection-title">
      <h2 class="section-label" id="collection-title">Explore</h2>
      <div class="links">
        <a class="game-link" href="gms/gdweb.html">
          <span class="game-name">Geometry Dash</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </section>

    <footer>Saturn-JS</footer>
  </main>
</body>
</html>
